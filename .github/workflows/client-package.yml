name: Client package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve package file name
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=openg2p-notification-${VERSION}.tgz" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client package
        working-directory: client
        env:
          HUSKY: "0"
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run build
          npm pack
          cp openg2p-notification-*.tgz "/tmp/${PACKAGE_NAME}"

      - name: Attach .tgz to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "/tmp/${PACKAGE_NAME}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
